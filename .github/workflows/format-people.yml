
name: Format People Files

on:
  push:
    branches:
      - fix/2718-stale-people-pagination
    paths:
      - '.github/workflows/format-people.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable

      - name: Format the two files
        run: |
          dart format \
            lib/features/people/presentation/providers/people_notifier.dart \
            test/unit/features/people/presentation/providers/people_notifier_test.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/people/presentation/providers/people_notifier.dart
          git add test/unit/features/people/presentation/providers/people_notifier_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format people notifier and tests"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
